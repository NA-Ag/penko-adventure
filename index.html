
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="A 100% offline-capable, adaptive language learning RPG. Explore procedurally generated worlds while mastering a new language.">
    
    <!-- PWA / Mobile Web App Capable -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Penko">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="Penko - Language Adventure RPG">
    <meta property="og:description" content="Learn languages through an infinite, procedurally generated RPG. 100% Free & Open Source.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://penko.gg/og-image.png"> <!-- Placeholder for future hosting -->
    <meta name="twitter:card" content="summary_large_image">

    <title>Penko - Language Adventure</title>
    <link rel="icon" type="image/svg+xml" href="/penguin-logo.svg">
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png">
    <link rel="manifest" href="/manifest.json">
    <script src="/tailwindcss.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --retro-bg: #0f172a;
            --retro-primary: #22d3ee;
            --retro-accent: #f59e0b;
            --retro-glow: rgba(34, 211, 238, 0.5);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--retro-bg);
            color: #e5e7eb;
            touch-action: manipulation;
            overscroll-behavior-y: none;
        }

        .font-pixel {
            font-family: 'VT323', monospace;
        }

        .font-retro {
            font-family: 'Press Start 2P', cursive;
            letter-spacing: 0.05em;
        }

        .glow-text {
            text-shadow: 0 0 4px var(--retro-glow),
                         0 0 8px var(--retro-glow);
        }

        .glow-box {
            box-shadow: 0 0 10px var(--retro-glow),
                        0 0 20px var(--retro-glow);
        }

        /* Custom Retro Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
            border: 1px solid var(--retro-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--retro-primary);
            border-radius: 2px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--retro-accent);
        }

        /* Scanlines Effect */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            background: linear-gradient(
                to bottom,
                transparent 50%,
                rgba(0, 0, 0, 0.1) 50%
            );
            background-size: 100% 4px;
            opacity: 0.3;
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes progress-stripes {
            from { background-position: 2rem 0; }
            to { background-position: 0 0; }
        }

        .animate-fade-in {
            animation: fade-in 0.3s ease-in;
        }
    </style>

</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
