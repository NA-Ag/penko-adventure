<!DOCTYPE html>
<html>
<head>
    <title>Penko Storage Diagnostic</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #0f0; }
        h1 { color: #0ff; }
        .success { color: #0f0; }
        .error { color: #f00; }
        .info { color: #ff0; }
        pre { background: #000; padding: 10px; border: 1px solid #333; }
    </style>
</head>
<body>
    <h1>📦 Penko Storage Diagnostic Tool</h1>
    <button onclick="checkStorage()">Check Storage</button>
    <div id="output"></div>

    <script>
        async function checkStorage() {
            const output = document.getElementById('output');
            output.innerHTML = '<p class="info">Checking storage...</p>';

            try {
                // Check Cache Storage (for models)
                const cacheKeys = await caches.keys();
                output.innerHTML += `<h2>Cache Storage (Models)</h2>`;
                output.innerHTML += `<p>Found ${cacheKeys.length} cache(s):</p>`;
                output.innerHTML += `<pre>${cacheKeys.join('\n') || 'None'}</pre>`;

                for (const key of cacheKeys) {
                    const cache = await caches.open(key);
                    const requests = await cache.keys();
                    output.innerHTML += `<p>${key}: ${requests.length} files</p>`;
                    if (requests.length > 0 && requests.length < 20) {
                        output.innerHTML += `<pre>${requests.map(r => r.url).join('\n')}</pre>`;
                    }
                }

                // Check IndexedDB (for dictionaries)
                const dbs = await indexedDB.databases();
                output.innerHTML += `<h2>IndexedDB (Dictionaries)</h2>`;
                output.innerHTML += `<p>Found ${dbs.length} database(s):</p>`;
                output.innerHTML += `<pre>${dbs.map(db => `${db.name} (v${db.version})`).join('\n') || 'None'}</pre>`;

                // Check Penko dictionary DB specifically
                const dbRequest = indexedDB.open('penko-dictionaries', 1);
                dbRequest.onsuccess = (event) => {
                    const db = event.target.result;
                    const transaction = db.transaction(['dictionaries'], 'readonly');
                    const store = transaction.objectStore('dictionaries');
                    const getAllRequest = store.getAll();

                    getAllRequest.onsuccess = () => {
                        const dicts = getAllRequest.result;
                        output.innerHTML += `<p class="success">Dictionaries stored: ${dicts.length}</p>`;
                        if (dicts.length > 0) {
                            output.innerHTML += `<pre>${dicts.map(d => `${d.langPair} - ${d.metadata?.name || 'Unknown'}`).join('\n')}</pre>`;
                        }
                    };
                };

                // Check quota
                if (navigator.storage && navigator.storage.estimate) {
                    const estimate = await navigator.storage.estimate();
                    const usedMB = (estimate.usage / 1024 / 1024).toFixed(2);
                    const quotaMB = (estimate.quota / 1024 / 1024).toFixed(2);
                    const percent = ((estimate.usage / estimate.quota) * 100).toFixed(1);

                    output.innerHTML += `<h2>Storage Quota</h2>`;
                    output.innerHTML += `<p>Used: ${usedMB} MB / ${quotaMB} MB (${percent}%)</p>`;
                }

            } catch (e) {
                output.innerHTML += `<p class="error">Error: ${e.message}</p>`;
            }
        }
    </script>
</body>
</html>
