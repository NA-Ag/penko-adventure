<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- 16-bit pixel art penguin WITH WIZARD HAT -->
  <defs>
    <style>
      .pixel { shape-rendering: crispEdges; }
    </style>
  </defs>

  <rect width="32" height="32" fill="none"/>

  <!-- Wizard Hat -->
  <!-- Hat tip -->
  <rect class="pixel" x="14" y="0" width="4" height="2" fill="#1a1a1a"/>
  <!-- Hat upper cone -->
  <rect class="pixel" x="12" y="2" width="2" height="2" fill="#1a1a1a"/>
  <rect class="pixel" x="14" y="2" width="4" height="2" fill="#9333ea"/>
  <rect class="pixel" x="18" y="2" width="2" height="2" fill="#1a1a1a"/>
  <!-- Hat mid cone -->
  <rect class="pixel" x="10" y="4" width="2" height="2" fill="#1a1a1a"/>
  <rect class="pixel" x="12" y="4" width="2" height="2" fill="#9333ea"/>
  <rect class="pixel" x="14" y="4" width="2" height="2" fill="#fbbf24"/> <!-- Star piece -->
  <rect class="pixel" x="16" y="4" width="4" height="2" fill="#9333ea"/>
  <rect class="pixel" x="20" y="4" width="2" height="2" fill="#1a1a1a"/>
  <!-- Hat brim outline top -->
  <rect class="pixel" x="6" y="6" width="4" height="2" fill="#1a1a1a"/>
  <rect class="pixel" x="10" y="6" width="12" height="2" fill="#9333ea"/>
  <rect class="pixel" x="22" y="6" width="4" height="2" fill="#1a1a1a"/>
  <!-- Hat brim body -->
  <rect class="pixel" x="4" y="8" width="2" height="2" fill="#1a1a1a"/>
  <rect class="pixel" x="6" y="8" width="20" height="2" fill="#9333ea"/>
  <rect class="pixel" x="26" y="8" width="2" height="2" fill="#1a1a1a"/>
  <!-- Hat brim outline bottom / Head top row -->
  <rect class="pixel" x="6" y="10" width="20" height="2" fill="#1a1a1a"/>

  <!-- Head with white face -->
  <rect class="pixel" x="8" y="12" width="2" height="2" fill="#1a1a1a"/>
  <rect class="pixel" x="10" y="12" width="2" height="2" fill="#ffffff"/>
  <rect class="pixel" x="12" y="12" width="8" height="2" fill="#1a1a1a"/>
  <rect class="pixel" x="20" y="12" width="2" height="2" fill="#ffffff"/>
  <rect class="pixel" x="22" y="12" width="2" height="2" fill="#1a1a1a"/>

  <!-- Eyes row -->
  <rect class="pixel" x="6" y="14" width="2" height="2" fill="#1a1a1a"/>
  <rect class="pixel" x="8" y="14" width="2" height="2" fill="#ffffff"/>
  <rect class="pixel" x="10" y="14" width="2" height="2" fill="#1a1a1a"/>
  <rect class="pixel" x="12" y="14" width="2" height="2" fill="#ffffff"/>
  <rect class="pixel" x="14" y="14" width="4" height="2" fill="#1a1a1a"/>
  <rect class="pixel" x="18" y="14" width="2" height="2" fill="#ffffff"/>
  <rect class="pixel" x="20" y="14" width="2" height="2" fill="#1a1a1a"/>
  <rect class="pixel" x="22" y="14" width="2" height="2" fill="#ffffff"/>
  <rect class="pixel" x="24" y="14" width="2" height="2" fill="#1a1a1a"/>

  <!-- Beak row -->
  <rect class="pixel" x="6" y="16" width="2" height="2" fill="#1a1a1a"/>
  <rect class="pixel" x="8" y="16" width="4" height="2" fill="#ffffff"/>
  <rect class="pixel" x="12" y="16" width="2" height="2" fill="#ffa500"/>
  <rect class="pixel" x="14" y="16" width="4" height="2" fill="#ffa500"/>
  <rect class="pixel" x="18" y="16" width="2" height="2" fill="#ffa500"/>
  <rect class="pixel" x="20" y="16" width="4" height="2" fill="#ffffff"/>
  <rect class="pixel" x="24" y="16" width="2" height="2" fill="#1a1a1a"/>

  <!-- Body start -->
  <rect class="pixel" x="6" y="18" width="2" height="2" fill="#1a1a1a"/>
  <rect class="pixel" x="8" y="18" width="4" height="2" fill="#ffffff"/>
  <rect class="pixel" x="12" y="18" width="8" height="2" fill="#1a1a1a"/>
  <rect class="pixel" x="20" y="18" width="4" height="2" fill="#ffffff"/>
  <rect class="pixel" x="24" y="18" width="2" height="2" fill="#1a1a1a"/>

  <!-- Wings row -->
  <rect class="pixel" x="4" y="20" width="2" height="2" fill="#1a1a1a"/>
  <rect class="pixel" x="6" y="20" width="2" height="2" fill="#ffffff"/>
  <rect class="pixel" x="8" y="20" width="4" height="2" fill="#1a1a1a"/>
  <rect class="pixel" x="12" y="20" width="8" height="2" fill="#ffffff"/>
  <rect class="pixel" x="20" y="20" width="4" height="2" fill="#1a1a1a"/>
  <rect class="pixel" x="24" y="20" width="2" height="2" fill="#ffffff"/>
  <rect class="pixel" x="26" y="20" width="2" height="2" fill="#1a1a1a"/>

  <!-- Body middle -->
  <rect class="pixel" x="6" y="22" width="2" height="2" fill="#1a1a1a"/>
  <rect class="pixel" x="8" y="22" width="4" height="2" fill="#1a1a1a"/>
  <rect class="pixel" x="12" y="22" width="8" height="2" fill="#ffffff"/>
  <rect class="pixel" x="20" y="22" width="4" height="2" fill="#1a1a1a"/>
  <rect class="pixel" x="24" y="22" width="2" height="2" fill="#1a1a1a"/>

  <!-- Body lower -->
  <rect class="pixel" x="8" y="24" width="2" height="2" fill="#1a1a1a"/>
  <rect class="pixel" x="10" y="24" width="12" height="2" fill="#ffffff"/>
  <rect class="pixel" x="22" y="24" width="2" height="2" fill="#1a1a1a"/>

  <!-- Feet row 1 -->
  <rect class="pixel" x="8" y="26" width="2" height="2" fill="#1a1a1a"/>
  <rect class="pixel" x="10" y="26" width="4" height="2" fill="#ffffff"/>
  <rect class="pixel" x="14" y="26" width="4" height="2" fill="#1a1a1a"/>
  <rect class="pixel" x="18" y="26" width="4" height="2" fill="#ffffff"/>
  <rect class="pixel" x="22" y="26" width="2" height="2" fill="#1a1a1a"/>

  <!-- Feet row 2 -->
  <rect class="pixel" x="8" y="28" width="2" height="2" fill="#ffa500"/>
  <rect class="pixel" x="10" y="28" width="2" height="2" fill="#ffa500"/>
  <rect class="pixel" x="12" y="28" width="2" height="2" fill="#1a1a1a"/>
  <rect class="pixel" x="14" y="28" width="4" height="2" fill="#1a1a1a"/>
  <rect class="pixel" x="18" y="28" width="2" height="2" fill="#1a1a1a"/>
  <rect class="pixel" x="20" y="28" width="2" height="2" fill="#ffa500"/>
  <rect class="pixel" x="22" y="28" width="2" height="2" fill="#ffa500"/>

  <!-- Feet outline bottom -->
  <rect class="pixel" x="8" y="30" width="4" height="2" fill="#1a1a1a"/>
  <rect class="pixel" x="20" y="30" width="4" height="2" fill="#1a1a1a"/>
</svg>